<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07080C">
    <title>LootStar — Игры</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/shared/common.css">
    <link rel="stylesheet" href="games.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="/shared/loading.js"></script>
    <script src="/shared/config.js"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/api.js"></script>
    <script src="/shared/currency.js"></script>
</head>

<body>

    <header>
        <div class="logo">
            <img src="/shared/logo.png" alt="LootStar" onerror="this.style.display='none'">
            <h1>LootStar</h1>
        </div>
        <div class="user-info">
            <div class="user-balance">
                <img src="/shared/star.png" alt="star">
                <p id="balanceDisplay">0</p>
            </div>
            <div class="user-balance silver">
                <img src="/shared/silver-star.svg" alt="silver">
                <p id="silverDisplay">0</p>
            </div>
            <div class="user-profile" onclick="location.href='../profile/index.html'">
                <img src="/shared/star.png" alt="user">
                <p id="userName">Username</p>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="cases-title">ИГРЫ</div>
        <div class="games-grid">

            <!-- НОВЫЙ РЕЖИМ: ТРЕЙД -->
            <div class="game-card" style="position: relative;" onclick="location.href='../trade/index.html'">
                <div class="case-badge new" style="position: absolute; top: 12px; right: 12px; z-index: 10; padding: 4px 10px; font-size: 10px; font-weight: 900; border-radius: 8px; background: linear-gradient(135deg, #4ADE80, #22C55E); color: #06140E; box-shadow: 0 4px 12px rgba(74,222,128,.4); letter-spacing: 1px;">NEW</div>
                <div class="game-icon trade" style="border-color: rgba(155, 134, 240, 0.4); box-shadow: 0 8px 20px rgba(0,0,0,.5), 0 0 16px rgba(155, 134, 240, 0.15);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#9B86F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 3l4 4-4 4"></path>
                        <path d="M20 7H4"></path>
                        <path d="M8 21l-4-4 4-4"></path>
                        <path d="M4 17h16"></path>
                    </svg>
                </div>
                <div class="game-name">Трейд</div>
                <div class="game-desc">Обменивайся предметами и звёздами с другими игроками</div>
            </div>

            <div class="game-card" onclick="location.href='../mines/index.html'">
                <div class="game-icon mines">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="14" r="6"></circle>
                        <line x1="12" y1="2" x2="12" y2="8"></line>
                        <line x1="5" y1="6" x2="9" y2="10"></line>
                        <line x1="19" y1="6" x2="15" y2="10"></line>
                    </svg>
                </div>
                <div class="game-name">Мины</div>
                <div class="game-desc">Открывай безопасные клетки</div>
            </div>

            <div class="game-card" onclick="location.href='../crash/index.html'">
                <div class="game-icon crash">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z">
                        </path>
                        <path
                            d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z">
                        </path>
                    </svg>
                </div>
                <div class="game-name">Краш</div>
                <div class="game-desc">Успей вывести до краха</div>
            </div>

            <div class="game-card" onclick="location.href='../craft/index.html'">
                <div class="game-icon craft">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z">
                        </path>
                    </svg>
                </div>
                <div class="game-name">Крафт</div>
                <div class="game-desc">Объединяй предметы</div>
            </div>

            <div class="game-card" onclick="location.href='../plinko/index.html'">
                <div class="game-icon plinko">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="6" cy="6" r="1.4" fill="currentColor" stroke="none"></circle>
                        <circle cx="12" cy="6" r="1.4" fill="currentColor" stroke="none"></circle>
                        <circle cx="18" cy="6" r="1.4" fill="currentColor" stroke="none"></circle>
                        <circle cx="9" cy="11" r="1.4" fill="currentColor" stroke="none"></circle>
                        <circle cx="15" cy="11" r="1.4" fill="currentColor" stroke="none"></circle>
                        <circle cx="12" cy="16" r="1.4" fill="currentColor" stroke="none"></circle>
                        <path d="M4 21h16"></path>
                    </svg>
                </div>
                <div class="game-name">Плинко</div>
                <div class="game-desc">Брось шарик и лови множитель</div>
            </div>

            <div class="game-card" onclick="location.href='../bags/index.html'">
                <div class="game-icon bags">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M8 8V6a4 4 0 0 1 8 0v2"></path>
                        <path d="M5.5 8h13l1.2 11.2a2 2 0 0 1-2 2.3H6.3a2 2 0 0 1-2-2.3L5.5 8z"></path>
                        <path d="M9 11c0 1.5 1.3 2.5 3 2.5s3-1 3-2.5"></path>
                    </svg>
                </div>
                <div class="game-name">Сумки</div>
                <div class="game-desc">Выбери одну сумку из трёх</div>
            </div>

            <div class="game-card" onclick="location.href='../slots/index.html'">
                <div class="game-icon slots">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <circle cx="8" cy="14" r="1.6" fill="currentColor" stroke="none"></circle>
                        <circle cx="12" cy="14" r="1.6" fill="currentColor" stroke="none"></circle>
                        <circle cx="16" cy="14" r="1.6" fill="currentColor" stroke="none"></circle>
                    </svg>
                </div>
                <div class="game-name">Слоты</div>
                <div class="game-desc">Крути барабаны и лови три в ряд</div>
            </div>

            

        </div>
    </main>

    <nav class="bnav">
        <button data-page="games" class="active" onclick="location.href='../games/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="3"></rect>
                <line x1="6" y1="12" x2="10" y2="12"></line>
                <line x1="8" y1="10" x2="8" y2="14"></line>
                <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"></circle>
                <circle cx="18" cy="12" r="1" fill="currentColor" stroke="none"></circle>
            </svg>
            <span>Игры</span>
        </button>
        <button data-page="cases" onclick="location.href='../index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z">
                </path>
            </svg>
            <span>Кейсы</span>
        </button>
        <button data-page="upgrades" onclick="location.href='../upgrades/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 19V5"></path>
                <path d="M5 12l7-7 7 7"></path>
            </svg>
            <span>Апгрейд</span>
        </button>
        <button data-page="profile" onclick="location.href='../profile/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Профиль</span>
        </button>
        <button data-page="leaderboard" onclick="location.href='../leaderboard/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"></path>
                <path d="M7 6H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 6h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"></path>
            </svg>
            <span>Лидеры</span>
        </button>
        <button data-page="tasks" onclick="location.href='../tasks/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                <path d="M8 8h8M8 12l2 2 4-4M8 17h5"></path>
            </svg>
            <span>Задания</span>
        </button>
    </nav>

    <script src="games.js"></script>
    <script src="/shared/sounds.js"></script>
    <script src="/shared/navigation.js"></script>
</body>

</html>
