<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#07080C">
    <title>LootStar — Проверка баланса</title>
    <link rel="stylesheet" href="/shared/common.css">
    <link rel="stylesheet" href="/SHOP/shop.css">
    <link rel="stylesheet" href="/checker.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/shared/config.js"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/api.js"></script>
    <script src="/shared/currency.js"></script>
</head>
<body>
    <main class="checker-main">
        <a class="checker-back" href="/SHOP/index.html">← В магазин</a>
        <header class="checker-header">
            <span class="shop-section-eyebrow">ДИАГНОСТИКА</span>
            <h1>История баланса</h1>
            <p>Поступления и списания, зафиксированные сервером.</p>
        </header>
        <section class="checker-balances" aria-label="Текущий баланс">
            <div><img src="/shared/star.png" alt=""> <span>Звёзды</span><strong id="checkerStars">0</strong></div>
            <div><img src="/shared/silver-star.svg" alt=""> <span>Серебро</span><strong id="checkerSilver">0</strong></div>
        </section>
        <section class="checker-history">
            <div class="checker-history-heading">
                <h2>Операции</h2>
                <button type="button" id="checkerRefresh">Обновить</button>
            </div>
            <p class="checker-notice">Показаны операции баланса, записанные сервером в PostgreSQL. Баланс и история загружаются из API.</p>
            <div id="checkerEntries" class="checker-entries"></div>
        </section>
    </main>
    <script src="/checker.js"></script>
</body>
</html>
