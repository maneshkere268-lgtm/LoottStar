<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0D0716">
    <title>LootStar — Halloween Event</title>

    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="../shared/common.css">
    <link rel="stylesheet" href="halloween.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="/shared/config.js"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/api.js"></script>
    <script src="/shared/currency.js"></script>
    <script src="/shared/gifts.js"></script>
    <script src="/shared/events.js"></script>
</head>
<body class="halloween-body">
    <div class="hw-scene" aria-hidden="true">
        <i class="hw-moon"></i><i class="hw-web l"></i><i class="hw-web r"></i><i class="hw-fog"></i><i class="hw-grave"></i>
        <span class="hw-bat" style="top:96px;animation-duration:21s,.45s;animation-delay:-4s,0s">🦇</span>
        <span class="hw-bat" style="top:150px;font-size:15px;animation-duration:28s,.38s;animation-delay:-16s,0s">🦇</span>
        <span class="hw-bat" style="top:60px;font-size:22px;animation-duration:34s,.5s;animation-delay:-27s,0s">🦇</span>
    </div>
    <div class="hw-leaves" id="leaves" aria-hidden="true"></div>

    <header>
        <div class="logo">
            <img src="/shared/logo.png" alt="LootStar" onerror="this.style.display='none'">
            <h1>LootStar</h1>
        </div>
        <div class="user-info">
            <div class="user-balance">
                <img src="/shared/star.png" alt="star">
                <p id="balanceDisplay">0</p>
            </div>
            <div class="user-balance" style="background:rgba(255,165,0,.15);border-color:rgba(255,165,0,.4);color:#FFA500;">
                <img src="/shared/pumpkin.png" alt="pumpkin" onerror="this.style.display='none'">
                <p id="pumpkinDisplay">0</p>
            </div>
            <div class="user-profile" onclick="location.href='../profile/index.html'">
                <img src="/shared/star.png" alt="user">
                <p id="userName">Username</p>
            </div>
        </div>
    </header>

    <main class="main halloween-main">
        <div class="hw-header">
            <h1 class="hw-title">HALLOWEEN</h1>
            <div class="hw-subtitle">EVENT 2026</div>
            <div class="hw-timer" id="hwTimer">ENDS IN 00:00:00</div>
        </div>

        <div class="hw-section-title">Cursed Cases:</div>
        <div class="cases-grid" id="hwCasesGrid">
            <!-- Генерируется в halloween.js -->
        </div>

        <div class="hw-interactive-row">
            <div class="hw-treat">
                <div class="hw-treat-head">
                    <div class="hw-section-title">Trick or Treat:</div>
                    <div class="hw-treat-rate" id="treatRate"></div>
                </div>
                <div class="hw-treat-bar" id="treatBar">
                    <div class="hw-treat-fill" id="treatFill"></div>
                    <i class="hw-treat-tick" style="left:25%"></i>
                    <i class="hw-treat-tick" style="left:50%"></i>
                    <i class="hw-treat-tick" style="left:75%"></i>
                    <span class="hw-treat-mark" id="treatNext"></span>
                    <img class="hw-treat-pumpkin" src="/shared/pumpkin.png" alt="">
                </div>
                <div class="hw-treat-foot">
                    <div class="hw-treat-online" id="treatOnline"></div>
                    <button class="hw-treat-claim" id="treatClaim" type="button" onclick="claimTreat()"></button>
                </div>
            </div>

            <div class="hw-shop-block">
                <div class="hw-section-title">Brews</div>
                <div class="hw-brew-list" id="brewList"></div>
            </div>
        </div>

        <div class="hw-section-title" style="margin-top:24px;">Halloween Spin:</div>
        <div class="hw-wheel-wrapper">
            <div class="hw-wheel-holder">
            <div class="hw-pointer"></div>
            <div class="hw-wheel" id="wheel">
                <div class="hw-wheel-spinner" id="wheelSpinner"></div>
                <div class="hw-wheel-center"><img src="/shared/pumpkin.png" onerror="this.style.display='none'"></div>
            </div>
            </div>
            <button class="hw-spin-btn" id="spinBtn" type="button" onclick="spinWheel()">SPIN (Free)</button>
            <div class="hw-spin-timer" id="spinTimer">Next free in 03:00:00</div>
        </div>

        <div class="hw-section-title" style="margin-top:24px;">Halloween Pass</div>
        <div class="hw-pass-tabs">
            <button class="hw-pass-tab active" type="button" onclick="switchPassTab('free')">Free Pass</button>
            <button class="hw-pass-tab pro" type="button" onclick="switchPassTab('pro')">Pro Pass 🔒</button>
        </div>

        <div class="hw-pass-track" id="passTrackFree"></div>
        <div class="hw-pass-track" id="passTrackPro" style="display:none;"></div>
    </main>

    <!-- ═══ МОДАЛКА КЕЙСА (из основного index.html) ═══ -->
    <div class="modal-overlay" id="caseModal">
        <div class="modal">
            <div class="modal-scroll">
                <div class="modal-handle"></div>
                <div class="modal-hdr">
                    <div class="modal-name" id="modalName">Кейс</div>
                    <div class="modal-price" id="modalPrice">
                        <img src="/shared/star.png" alt=""><span>0</span>
                    </div>
                </div>

                <div class="roulette-wrap" id="rouletteWrap">
                    <div class="roulette-track idle" id="rouletteTrack"></div>
                    <div class="roulette-pointer ptr-top"></div>
                    <div class="roulette-pointer ptr-bottom"></div>
                </div>

                <div class="modal-win" id="modalWin" style="display:none"></div>

                <div class="open-btn-wrap" id="openBtnWrap">
                    <button class="open-btn" id="openBtn" type="button" onclick="openCase()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M5 12h14M12 5l7 7-7 7"></path>
                        </svg>
                        Открыть кейс
                    </button>
                </div>

                <div class="contents" id="contentsSection">
                    <div class="contents-title">Что в кейсе?</div>
                    <div class="contents-grid" id="contentsGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bnav">
        <button data-page="games" type="button" onclick="location.href='../games/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"></rect><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"></circle><circle cx="18" cy="12" r="1" fill="currentColor" stroke="none"></circle></svg>
            <span>Игры</span>
        </button>
        <button data-page="cases" class="active" type="button" onclick="location.href='../index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
            <span>Кейсы</span>
        </button>
        <button data-page="upgrades" type="button" onclick="location.href='../upgrades/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
            <span>Апгрейд</span>
        </button>
        <button data-page="profile" type="button" onclick="location.href='../profile/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Профиль</span>
        </button>
        <button data-page="leaderboard" type="button" onclick="location.href='../leaderboard/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"></path><path d="M7 6H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 6h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"></path></svg>
            <span>Лидеры</span>
        </button>
        <button data-page="tasks" type="button" onclick="location.href='../tasks/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12l2 2 4-4M8 17h5"></path></svg>
            <span>Задания</span>
        </button>
    </nav>

    <div class="toast" id="toast"></div>
    <script src="halloween.js" defer></script>
    <script src="/shared/sounds.js" defer></script>
    <script src="/shared/navigation.js"></script>
</body>
</html>
