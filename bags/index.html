<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07080C">
    <title>LootStar — Сумки</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../games/games.css">
    <link rel="stylesheet" href="/shared/common.css">
    <link rel="stylesheet" href="bags.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="/shared/loading.js"></script>
    <script src="/shared/config.js"></script>
    <script src="/shared/auth.js"></script>
    <script src="/shared/currency.js"></script>
    <script src="/shared/gifts.js"></script>
    <script src="/shared/api.js"></script>
</head>

<body>

    <header>
        <div class="logo">
            <img src="/shared/logo.png" alt="LootStar" onerror="this.style.display='none'">
            <h1>LootStar</h1>
        </div>
        <div class="user-info">
            <div class="user-balance">
                <img src="/shared/star.png" alt="star">
                <p id="balanceDisplay">0</p>
            </div>
            <div class="user-balance silver">
                <img src="/shared/silver-star.svg" alt="silver">
                <p id="silverDisplay">0</p>
            </div>
            <div class="user-profile" onclick="location.href='../profile/index.html'">
                <img src="/shared/star.png" alt="user">
                <p id="userName">Username</p>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="cases-title">СУМКИ</div>

        <div class="bags-info">Открой любую сумку — выигрыш достанется только с неё</div>

        <div class="bags-grid" id="bagsGrid"></div>

        <div class="bet-panel">
            <div id="curSwitch"></div>
            <div class="bet-input-wrap">
                <input id="betAmount" type="number" value="100" min="10" max="50000000" step="10">
                <button onclick="document.getElementById('betAmount').value=25">25</button>
                <button onclick="document.getElementById('betAmount').value=100">100</button>
                <button onclick="document.getElementById('betAmount').value=500">500</button>
            </div>
            <button class="place-btn" id="bagsSubmit" onclick="onSubmit()">Открыть</button>
        </div>
    </main>

    <nav class="bnav">
        <button data-page="games" class="active" onclick="location.href='../games/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="2" y="6" width="20" height="12" rx="3"></rect>
                <line x1="6" y1="12" x2="10" y2="12"></line>
                <line x1="8" y1="10" x2="8" y2="14"></line>
                <circle cx="15" cy="10" r="1" fill="currentColor" stroke="none"></circle>
                <circle cx="18" cy="12" r="1" fill="currentColor" stroke="none"></circle>
            </svg>
            <span>Игры</span>
        </button>
        <button data-page="cases" onclick="location.href='../index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                    d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z">
                </path>
            </svg>
            <span>Кейсы</span>
        </button>
        <button data-page="upgrades" onclick="location.href='../upgrades/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M12 19V5"></path>
                <path d="M5 12l7-7 7 7"></path>
            </svg>
            <span>Апгрейд</span>
        </button>
        <button data-page="profile" onclick="location.href='../profile/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Профиль</span>
        </button>
        <button data-page="leaderboard" onclick="location.href='../leaderboard/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4z"></path>
                <path d="M7 6H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4M17 6h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"></path>
            </svg>
            <span>Лидеры</span>
        </button>
        <button data-page="tasks" onclick="location.href='../tasks/index.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                <path d="M8 8h8M8 12l2 2 4-4M8 17h5"></path>
            </svg>
            <span>Задания</span>
        </button>
    </nav>

    <div class="toast" id="toast"></div>
    <script src="bags.js"></script>
    <script src="/shared/sounds.js"></script>
    <script src="/shared/navigation.js"></script>
</body>

</html>
